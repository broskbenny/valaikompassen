name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate program dataset
        run: python3 scripts/validate_dataset.py
      - name: Validate Riksdagen vote dataset
        run: python3 scripts/validate_riksdagen_votes.py
      - name: Validate issue clusters
        run: python3 scripts/validate_issue_clusters.py
      - name: Run app tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check src/core.js
